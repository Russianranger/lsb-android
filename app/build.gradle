plugins { id 'com.android.application' }
android {
    namespace 'io.github.russianranger.lsb'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.russianranger.lsb'
        minSdk 26
        targetSdk 35
        versionCode 21
        versionName '0.5.5'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets.main.assets.srcDir rootProject.file('out/launcher-assets')
    sourceSets.main.assets.srcDir rootProject.file('out/server-packaged-assets')
    sourceSets.main.assets.srcDir rootProject.file('out/runtime-packaged-assets')
    sourceSets.main.jniLibs.srcDir rootProject.file('out/runtime-libs')
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libproot.so', '**/libproot-loader.so'] } }
    buildTypes { release { minifyEnabled false } }
}

tasks.register('buildWindowsLauncher', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/build-launcher.py'
    inputs.files(rootProject.fileTree('windows') { include '*.c', '*.h' }, rootProject.file('scripts/build-launcher.py'))
    outputs.file(rootProject.file('out/launcher-assets/LSB-FFXI.exe'))
    outputs.dir(rootProject.file('out/runtime-probes'))
}
tasks.named('preBuild').configure { dependsOn 'buildWindowsLauncher' }

tasks.register('prepareRuntime', Exec) {
    dependsOn 'buildWindowsLauncher'
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/prepare-runtime.py'
}
tasks.named('preBuild').configure { dependsOn 'prepareRuntime' }
